services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsc
      POSTGRES_PASSWORD: dsc_password
      POSTGRES_DB: dsc_ebooks
    volumes:
      - dsc_ebooks_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsc -d dsc_ebooks"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-lgtm:
    image: grafana/otel-lgtm
    container_name: otel-lgtm
    ports:
      - "3001:3000"   # Grafana (interface web)
      - "4317:4317"   # OTLP via gRPC
      - "4318:4318"   # OTLP via HTTP

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:8080"
    environment:
      DATABASE_URL: "postgresql://dsc:dsc_password@db:5432/dsc_ebooks?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OTEL_SERVICE_NAME: eq04-alelib
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      NODE_OPTIONS: "--require @opentelemetry/auto-instrumentations-node/register"

volumes:
  dsc_ebooks_db_data: