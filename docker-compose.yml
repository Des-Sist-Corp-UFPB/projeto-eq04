services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eq04-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - db

    ports:
      - "127.0.0.1:8104:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: eq04-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: dsc
      POSTGRES_PASSWORD: dsc_password
      POSTGRES_DB: dsc_ebooks

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
