services:
  app:
    image: ghcr.io/des-sist-corp-ufpb/projeto-eq04:latest
    container_name: eq04-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
       - "127.0.0.1:8104:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

