services:
  app:
    image: ${APP_IMAGE}
    container_name: eq04-app
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.url: jdbc:postgresql://postgres:5432/eq04
      spring.datasource.username: eq04
      spring.datasource.driver-class-name: org.postgresql.Driver
      spring.datasource.hikari.maximum-pool-size: 5
    ports:
      - "127.0.0.1:8104:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
