services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsc
      POSTGRES_PASSWORD: dsc_password
      POSTGRES_DB: dsc_ebooks
    ports:
      - "5432:5432"
    volumes:
      - dsc_ebooks_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsc -d dsc_ebooks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://dsc:dsc_password@db:5432/dsc_ebooks?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

volumes:
  dsc_ebooks_db_data:
