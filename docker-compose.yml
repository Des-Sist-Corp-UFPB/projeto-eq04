services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eq04-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8104:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
