<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Livraria DSC</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <style>
        body {
            background: linear-gradient(135deg, #4a2c0b 0%, #2c1810 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            border-radius: 1.2rem;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #8b4513, #5c3317);
            border-radius: 1.2rem 1.2rem 0 0;
            padding: 2.5rem 2rem;
            text-align: center;
            color: #f5e6d3;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .login-header p {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 0;
            font-style: italic;
        }

        .card-body {
            background-color: #fffaf0;
            padding: 2.5rem 2rem;
        }

        .form-label {
            color: #5c3317;
            font-weight: 600;
        }

        .input-group-text {
            background-color: #f5e6d3;
            border-color: #8b4513;
            color: #5c3317;
        }

        .form-control {
            border-color: #8b4513;
        }

        .form-control:focus {
            border-color: #c19a6b;
            box-shadow: 0 0 0 0.25rem rgba(139, 69, 19, 0.25);
        }

        .btn-primary {
            background-color: #8b4513;
            border-color: #8b4513;
            padding: 0.75rem;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #a67b5b;
            border-color: #a67b5b;
        }

        .alert {
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>

<div class="login-card bg-white">

    <!-- Cabeçalho -->
    <div class="login-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" fill="#f5e6d3"
             class="bi bi-book mb-3" viewBox="0 0 16 16">
            <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.915-.35-2.107-.692-3.287-.811-1.094-.11-2.278-.043-3.213.493V2.687zM8 1.783C6.5 1.12 4.915.79 3.5.72 1.85.65 0 1.32 0 2.5v10c0 1.18 1.85 1.85 3.5 1.92 1.415.07 2.9.4 4.5 1.063 1.6-.663 3.085-.993 4.5-1.063 1.65-.07 3.5-.74 3.5-1.92V2.5c0-1.18-1.85-1.85-3.5-1.78C11.085.79 9.5 1.12 8 1.783z"/>
        </svg>
        <h1>Livraria Digital</h1>
        <p>Conhecimento que tranforma à distancia de um click • Desde 2026</p>
    </div>

    <!-- Corpo -->
    <div class="card-body">

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
            </svg>
            <div>Usuário ou senha inválidos. Tente novamente.</div>
        </div>

        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-circle-fill me-2" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0z"/>
                <path d="M10.97 5.97a.75.75 0 0 0-1.06 1.06L11.293 8 9.91 9.47a.75.75 0 1 0 1.06 1.06L12.353 9l1.47 1.53a.75.75 0 0 0 1.06-1.06L13.41 8l1.47-1.53a.75.75 0 1 0-1.06-1.06L12.353 7 10.97 5.47z"/>
            </svg>
            <div>Logout realizado com sucesso!</div>
        </div>

        <h2 class="h5 text-center mb-4" style="color: #5c3317;">Bem-vindo(a) de volta</h2>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                            <path d="M8 9a6 6 0 0 0-6 6v1h12v-1a6 6 0 0 0-6-6"/>
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Digite seu usuário" autocomplete="username" required autofocus/>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2"/>
                            <path d="M3 7v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V7H3z"/>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Digite sua senha" autocomplete="current-password" required/>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-door-open me-2" viewBox="0 0 16 16">
                        <path d="M8.5 2.5a.5.5 0 0 0-1 0v.5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-3.5z"/>
                        <path d="M10.828 7.172a.5.5 0 0 0-.707.707L11.293 9H6.5a.5.5 0 0 0 0 1h4.793l-1.172 1.172a.5.5 0 0 0 .707.707L13 9.707l-2.172-2.535z"/>
                    </svg>
                    Entrar
                </button>
            </div>
        </form>

        <div class="mt-4 p-3 bg-light rounded border text-center">
            <small class="text-muted">
                <strong>Desenvolvimento:</strong> admin / admin123
            </small>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
