<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="modal">

    <div class="modal fade" id="produtoModal" tabindex="-1"
         aria-labelledby="produtoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="produtoModalLabel">
                        <span th:text="${livro == null} ? 'Novo Livro' : 'Editar Livro'">Livro</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <form th:object="${form}"
                      th:attr="
                        hx-post=${livro == null ? '/produtos' : null},
                        hx-put=${livro != null ? '/produtos/' + livro.id : null},
                        hx-target=${livro == null ? '#lista-livros' : '#produto-' + livro.id},
                        hx-swap=${livro == null ? 'beforeend' : 'outerHTML'}"
                      hx-on--after-request="if(event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('produtoModal')).hide(); }">

                    <div class="modal-body">

                        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Erro</li>
                            </ul>
                        </div>

                        <!-- Título -->
                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-semibold">
                                Título <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   th:field="*{titulo}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                                   placeholder="Ex.: Clean Code"
                                   maxlength="120"
                                   required/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('titulo')}"
                                 th:errors="*{titulo}">
                                Erro no título
                            </div>
                            <div class="form-text">Entre 2 e 120 caracteres.</div>
                        </div>

                        <!-- Autor -->
                        <div class="mb-3">
                            <label for="autor" class="form-label fw-semibold">
                                Autor <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   th:field="*{autor}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('autor')} ? 'is-invalid'"
                                   placeholder="Ex.: Robert C. Martin"
                                   maxlength="150"
                                   required/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('autor')}"
                                 th:errors="*{autor}">
                                Erro no autor
                            </div>
                            <div class="form-text">Entre 2 e 150 caracteres.</div>
                        </div>

                        <!-- Descrição -->
                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-semibold">Descrição</label>
                            <textarea th:field="*{descricao}"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                      rows="3"
                                      placeholder="Descrição opcional do livro..."
                                      maxlength="2000"></textarea>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('descricao')}"
                                 th:errors="*{descricao}">
                                Erro na descrição
                            </div>
                            <div class="form-text">Opcional. Máximo de 2000 caracteres.</div>
                        </div>

                        <!-- Preço e Ano lado a lado -->
                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label for="preco" class="form-label fw-semibold">
                                    Preço (R$) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number"
                                           th:field="*{preco}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid'"
                                           placeholder="0,00"
                                           step="0.01"
                                           min="0"
                                           required/>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('preco')}"
                                         th:errors="*{preco}">
                                        Erro no preço
                                    </div>
                                </div>
                                <div class="form-text">Valor em reais com até 2 casas decimais.</div>
                            </div>

                            <div class="col-md-5 mb-3">
                                <label for="anoPublicacao" class="form-label fw-semibold">Ano de Publicação</label>
                                <input type="number"
                                       th:field="*{anoPublicacao}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('anoPublicacao')} ? 'is-invalid'"
                                       placeholder="Ex.: 2008"
                                       min="1000"
                                       max="9999"/>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('anoPublicacao')}"
                                     th:errors="*{anoPublicacao}">
                                    Erro no ano
                                </div>
                                <div class="form-text">Opcional.</div>
                            </div>
                        </div>

                        <!-- Info em modo edição -->
                        <div th:if="${livro != null}" class="alert alert-light border small">
                            <div class="row">
                                <div class="col-sm-6">
                                    <strong>Criado em:</strong>
                                    <span th:text="${#temporals.format(livro.criadoEm.atZone(T(java.time.ZoneId).systemDefault()).toLocalDateTime(), 'dd/MM/yyyy HH:mm')}">
                                        00/00/0000
                                    </span>
                                </div>
                                <div class="col-sm-6">
                                    <strong>Atualizado em:</strong>
                                    <span th:text="${#temporals.format(livro.atualizadoEm.atZone(T(java.time.ZoneId).systemDefault()).toLocalDateTime(), 'dd/MM/yyyy HH:mm')}">
                                        00/00/0000
                                    </span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" class="bi bi-check-lg me-1" viewBox="0 0 16 16">
                                <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
                            </svg>
                            <span th:text="${livro == null} ? 'Salvar Livro' : 'Atualizar Livro'">Salvar</span>
                            <span class="spinner-border spinner-border-sm htmx-indicator ms-1"
                                  role="status" aria-hidden="true"></span>
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</th:block>

</body>
</html>
