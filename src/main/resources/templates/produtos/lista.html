<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main})}">
<head>
    <title>Livros</title>
</head>
<body>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Catálogo de Livros</h1>
            <p class="text-muted mb-0">Gerencie o catálogo de livros</p>
        </div>
        <button class="btn btn-primary"
                hx-get="/produtos/novo"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                hx-indicator="#spinner">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                 class="bi bi-plus-lg me-1" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
            </svg>
            Novo Livro
            <span id="spinner" class="spinner-border spinner-border-sm htmx-indicator ms-1"
                  role="status" aria-hidden="true"></span>
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                        </span>
                        <input type="search"
                               name="busca"
                               class="form-control"
                               placeholder="Buscar por título..."
                               th:value="${busca}"
                               hx-get="/produtos/fragmento-tabela"
                               hx-trigger="keyup changed delay:400ms, search"
                               hx-target="#tabela-container"
                               hx-swap="innerHTML"/>
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <span class="text-muted small" th:if="${livros != null}">
                        <span th:text="${livros.totalElements}">0</span> livro(s) encontrado(s)
                    </span>
                </div>
            </div>

            <div id="tabela-container">
                <th:block th:insert="~{produtos/fragments/tabela :: tabela}"></th:block>
            </div>

        </div>
    </div>

</main>

</body>
</html>
