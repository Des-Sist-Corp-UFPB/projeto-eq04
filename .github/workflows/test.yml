name: Tests

on:
  push:
    branches: [main, feedback]
  pull_request:
    branches: [main, feedback]

jobs:
  unit-and-integration:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dscebooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/dscebooks_test
      AUTH_SECRET: ci-test-secret-min-32-chars-long!!
      AUTH_URL: http://localhost:3000
      GROQ_API_KEY: mock-key-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma generate
      - run: npx prisma db push --skip-generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    runs-on: self-hosted
    needs: unit-and-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dscebooks_test
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/dscebooks_test
      AUTH_SECRET: ci-test-secret-min-32-chars-long!!
      AUTH_URL: http://localhost:3000
      GROQ_API_KEY: mock-key-for-ci
      E2E_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start app in background
        run: npm run start &
      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000
      - run: npm run test:e2e