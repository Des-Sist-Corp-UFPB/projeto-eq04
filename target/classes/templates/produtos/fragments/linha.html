<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<tr th:fragment="linha"
    th:id="'produto-' + ${livro.id}">

    <td class="text-muted small" th:text="${livro.id}">#1</td>

    <td>
        <span class="fw-semibold" th:text="${livro.titulo}">Título do Livro</span>
    </td>

    <td>
        <span class="text-muted small" th:text="${livro.autor}">Autor</span>
    </td>

    <td>
        <span th:if="${livro.descricao != null and !livro.descricao.isEmpty()}"
              th:text="${#strings.abbreviate(livro.descricao, 80)}"
              th:title="${livro.descricao}"
              class="text-muted small">
            Descrição...
        </span>
        <span th:unless="${livro.descricao != null and !livro.descricao.isEmpty()}"
              class="text-muted fst-italic small">
            Sem descrição
        </span>
    </td>

    <td class="text-end">
        <span class="badge bg-success fs-6">
            R$ <span th:text="${#numbers.formatDecimal(livro.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
        </span>
    </td>

    <td class="text-center">
        <span class="text-muted small" th:text="${livro.anoPublicacao != null ? livro.anoPublicacao : '—'}">—</span>
    </td>

    <td class="text-center">
        <div class="btn-group btn-group-sm" role="group">

            <button type="button"
                    class="btn btn-outline-primary"
                    th:attr="hx-get='/produtos/' + ${livro.id} + '/editar'"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    title="Editar livro">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                     class="bi bi-pencil" viewBox="0 0 16 16">
                    <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                </svg>
            </button>

            <button type="button"
                    class="btn btn-outline-danger"
                    th:attr="hx-delete='/produtos/' + ${livro.id},
                             hx-target='#produto-' + ${livro.id},
                             hx-confirm='Confirma a exclusão do livro &quot;' + ${livro.titulo} + '&quot;?'"
                    hx-swap="outerHTML"
                    title="Excluir livro">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                     class="bi bi-trash" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                </svg>
            </button>

        </div>
    </td>

</tr>

</body>
</html>
